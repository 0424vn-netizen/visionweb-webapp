<html>
<head>
    <title>Test Report Template</title>
    <style type="text/css">
        /*Common*/
        .top-padding-5 {
            padding-top: 5px;
        }

        .white-color {
            color: white;
        }

        /*End*/

        .header-left {
            float: left;
            width: 70.4%;
            background-color: #0060A9;
        }

        .header-left-icon {
            float: left;
        }

        .header-left-content {
            float: left;
        }

        .header-left-text {
            margin-left: 86px;
        }

        .header-right {
            width: 29.6%;
            float: left;
        }
        
        .row-text {
            font-weight: bold;
            text-align: right;
            padding: 2px 10px 2px 0px;
            width: 130px;
            display: inline-block;
        }

        /*End Header*/
    </style>
</head>
<body>
    <div class="header" style="font-size: 11.85px; margin-left: -10px; font-family: Arial; letter-spacing: -0.4px">
        <div class="header-left">
            <div class="header-left-content">
                <div class="header-left-icon">
                    [Logo]
                </div>
                <div class="header-left-text white-color" style="padding: 8px 0 8px 20px;">
                    <div><b>[ClientName]</b></div>
                    <div>[Address1]</div>
                    <div>[Address2]</div>
                    <div>[Contact]</div>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div>
                <div>
                    <span class="row-text">[_Page_]</span>
                    <span>[PageNumber] [_of_] [PageTotal]</span>
                </div>
                <div>
                    <span class="row-text">[_MerchantID_]</span>
                    <span>[MerchantNumber]</span>
                </div>
                <div>
                    <span class="row-text">[_StatementDate_]</span>
                    <span>[StatementPeriod]</span>
                </div>
                <div>
                    <span class="row-text">[_Questions_]</span>
                    <span>[Question]</span>
                </div>
              </div>  
        </div>
    </div>
</body>
</html>
