        <h2 class="grid-title">
            {{res:HierarchyInformation}}
        </h2>
    </div>
</div>

            <colgroup>

                <col class="w-55">
            </colgroup>
            <tr class="Row">
                <td class="heading">
                    {{res:Platform}}
                </td>
                <td>
                    {{data:MBHPLATFORM|Hierarchy|HierarchyInformation|EntityNumber1}}

            <tr class="AltRow">
                <td class="heading">
                    {{res:Channel}}
                </td>
                <td>
                    {{data:MBHCHANNEL|Hierarchy|HierarchyInformation|EntityNumber2}}
                </td>
            </tr>
            <tr class="Row">
                <td class="heading">
                    {{res:Chain}}
                </td>
